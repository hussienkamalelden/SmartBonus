<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Smart Bonus | لوحة قائمة الانتظار</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <!-- login -->
  <main class="login" id="login">
    <form class="card login__card" id="loginForm" autocomplete="on">
      <div class="brand"><img src="/assets/img/logo-mark.svg" alt="" width="40" height="40"><span class="wordmark">Smart <b>Bonus</b></span></div>
      <h1>لوحة قائمة الانتظار</h1>
      <p class="muted">سجّل الدخول لعرض كل من سجّل في قائمة الانتظار.</p>
      <label for="u">اسم المستخدم</label>
      <input id="u" name="username" autocomplete="username" dir="ltr" required>
      <label for="p">كلمة المرور</label>
      <input id="p" name="password" type="password" autocomplete="current-password" dir="ltr" required>
      <p class="err" id="loginErr" role="alert" hidden></p>
      <button class="btn" type="submit" id="loginBtn">تسجيل الدخول</button>
    </form>
  </main>

  <!-- dashboard -->
  <div class="dash" id="dash" hidden>
    <header class="bar">
      <div class="brand"><img src="/assets/img/logo-mark.svg" alt="" width="34" height="34"><span class="wordmark">Smart <b>Bonus</b></span><span class="tag">قائمة الانتظار</span></div>
      <div class="bar__actions">
        <button class="btn btn--ghost" id="refresh">تحديث</button>
        <button class="btn btn--ghost" id="csv">تنزيل Excel (CSV)</button>
        <button class="btn btn--ghost" id="logout">تسجيل الخروج</button>
      </div>
    </header>

    <section class="stats">
      <div class="card stat"><span>إجمالي المسجلين</span><strong id="sTotal">0</strong></div>
      <div class="card stat"><span>صيدليات</span><strong id="sPh">0</strong></div>
      <div class="card stat"><span>موردون</span><strong id="sSu">0</strong></div>
      <div class="card stat"><span>اليوم</span><strong id="sToday">0</strong></div>
    </section>

    <section class="card table-card">
      <div class="tools">
        <input id="q" type="search" placeholder="ابحث بالاسم أو البريد أو الهاتف…">
        <select id="role">
          <option value="">الكل</option>
          <option value="pharmacy">صيدليات</option>
          <option value="supplier">موردون</option>
        </select>
        <span class="muted" id="shown"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>النوع</th><th>الاسم</th><th>البريد الإلكتروني</th><th>الهاتف</th><th>الدولة</th><th>تاريخ التسجيل (UTC)</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty muted" id="empty" hidden>لا يوجد مسجلون بعد.</p>
      </div>
    </section>
  </div>
  <script src="/js/admin.js" defer></script>
</body>
</html>
