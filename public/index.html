<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Bonus | الطريقة الأذكى لتوريد الأدوية</title>
  <meta name="description" content="Smart Bonus يقارن لك عروض كل الموردين ويحسب البونص ويقترح البدائل في ثانية. شاهد الإعلان في 60 ثانية وانضم لقائمة الانتظار.">
  <meta name="theme-color" content="#0B0726">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:title" content="Smart Bonus | صيدليتك على وشك أن تصبح أذكى بكثير">
  <meta property="og:description" content="شاهد الإعلان في 60 ثانية واحجز مكانك في قائمة الانتظار.">
  <meta property="og:image" content="/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/Alexandria-Bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="/assets/fonts/ReadexPro-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="/assets/video/poster.jpg" as="image">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    // pick language before first paint (default: Arabic)
    (function () {
      var l = 'ar';
      try {
        var q = new URLSearchParams(location.search).get('lang');
        l = q === 'en' || q === 'ar' ? q : (localStorage.getItem('sb_lang') || 'ar');
      } catch (e) {}
      if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    })();
  </script>
</head>
<body>
  <!-- animated background -->
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__orb bg__orb--1"></div>
    <div class="bg__orb bg__orb--2"></div>
    <div class="bg__orb bg__orb--3"></div>
    <div class="bg__caps" id="caps"></div>
    <div class="bg__spot" id="spot"></div>
  </div>

  <header class="top">
    <a class="brand" href="/" aria-label="Smart Bonus">
      <img src="/assets/img/logo-mark.svg" alt="" width="40" height="40">
      <span class="wordmark">Smart <b>Bonus</b></span>
    </a>
    <div class="top__actions">
      <button class="lang" id="langBtn" type="button" aria-label="Switch language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4c2.4 2.4 3.6 5.3 3.6 8.6s-1.2 6.2-3.6 8.6c-2.4-2.4-3.6-5.3-3.6-8.6S9.6 5.8 12 3.4z"/></svg>
        <span id="langLabel">English</span>
      </button>
      <button class="btn btn--ghost btn--sm top__cta" data-open-waitlist data-i18n="navCta">انضم لقائمة الانتظار</button>
    </div>
  </header>

  <main class="hero">
    <div class="hero__intro">
      <h1 class="hero__title reveal" style="--d:0" data-i18n-html="title">صيدليتك… <span class="grad">أذكى.</span></h1>
      <p class="hero__sub reveal" style="--d:1" data-i18n="sub">كل الموردين والأسعار والبونص… في ثانية واحدة.</p>
    </div>

    <section class="player reveal" style="--d:2" aria-label="Smart Bonus video">
      <div class="player__glow" aria-hidden="true"></div>
      <div class="player__frame is-loading" id="tilt">
        <video id="intro" preload="none" playsinline
               poster="/assets/video/poster.jpg"
               data-src="/assets/video/smartbonus-intro.mp4"></video>

        <!-- loading state (until the poster / video is ready) -->
        <div class="loader" id="loader" aria-hidden="true">
          <div class="loader__shimmer"></div>
          <div class="loader__mark">
            <img src="/assets/img/logo-mark.svg" alt="" width="72" height="72">
            <span class="loader__orbit"></span>
          </div>
          <p class="loader__text" data-i18n="loading">جارٍ تجهيز الفيديو…</p>
          <div class="loader__bar"><span></span></div>
        </div>

        <button class="player__play" id="playBtn" data-i18n-aria="play" aria-label="شغّل الفيديو">
          <span class="player__ring"></span><span class="player__ring player__ring--2"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        </button>
        <div class="player__badges" id="badges">
          <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></svg><span data-i18n="chipTime">60 ثانية</span></span>
          <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><span data-i18n="chipSound">شغّل الصوت</span></span>
        </div>
        <div class="player__end" id="endCard" hidden>
          <p class="player__end-title" data-i18n="endTitle">جاهز تشتري بذكاء؟</p>
          <div class="player__end-actions">
            <button class="btn btn--primary" data-open-waitlist data-i18n="endCta">انضم لقائمة الانتظار</button>
            <button class="btn btn--ghost" id="replay">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg><span data-i18n="replay">إعادة التشغيل</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="hero__cta reveal" style="--d:3">
      <button class="btn btn--primary btn--lg" data-open-waitlist data-role="pharmacy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 21V8.5L12 3l8.5 5.5V21"/><path d="M9 21v-6h6v6M12 7.5v4M10 9.5h4"/></svg>
        <span data-i18n="ctaPharmacy">أنا صيدلية</span>
      </button>
      <button class="btn btn--glass btn--lg" data-open-waitlist data-role="supplier">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 6.5h10.6v9.6H2.8z"/><path d="M13.4 9.6h4.1l3.1 3.3v3.2h-7.2"/><circle cx="7" cy="17.6" r="1.9"/><circle cx="17.2" cy="17.6" r="1.9"/></svg>
        <span data-i18n="ctaSupplier">أنا مورّد</span>
      </button>
    </div>

  </main>

  <footer class="foot">
    <span>© <span id="year">2026</span> Smart Bonus. <span data-i18n="rights">جميع الحقوق محفوظة.</span></span>
  </footer>

  <!-- Waitlist modal -->
  <div class="modal" id="waitlist" role="dialog" aria-modal="true" aria-labelledby="wlTitle" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="document">
      <button class="modal__x" data-close data-i18n-aria="close" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>

      <div class="wl" id="wlForm">
        <h2 id="wlTitle" data-i18n="mTitle">احجز مكانك مبكرًا</h2>

        <form id="form" novalidate>
          <fieldset class="seg">
            <input type="radio" name="role" id="rPharmacy" value="pharmacy" checked>
            <label for="rPharmacy" data-i18n="rolePharmacy">صيدلية</label>
            <input type="radio" name="role" id="rSupplier" value="supplier">
            <label for="rSupplier" data-i18n="roleSupplier">مورّد</label>
            <span class="seg__pill" aria-hidden="true"></span>
          </fieldset>

          <div class="field">
            <label for="name"><span data-i18n="fName">الاسم بالكامل</span> <span class="opt" data-i18n="optional">(اختياري)</span></label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="100" data-i18n-ph="phName" placeholder="مثال: د. أحمد علي">
          </div>
          <div class="field">
            <label for="email"><span data-i18n="fEmail">البريد الإلكتروني</span> <span class="req" data-req="email">*</span><span class="opt" data-opt="email" data-i18n="optional" hidden>(اختياري)</span></label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@pharmacy.com" dir="ltr">
          </div>
          <div class="field">
            <label for="phone"><span data-i18n="fPhone">رقم الهاتف / واتساب</span> <span class="req" data-req="phone">*</span><span class="opt" data-opt="phone" data-i18n="optional" hidden>(اختياري)</span></label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="25" placeholder="+218 91 234 5678" dir="ltr">
          </div>
          <p class="hint" id="hint">يكفي البريد الإلكتروني أو رقم الهاتف.</p>

          <!-- honeypot -->
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

          <p class="err" id="err" role="alert" hidden></p>
          <button class="btn btn--primary btn--block" type="submit" id="submit">
            <span class="btn__label" data-i18n="submit">انضم لقائمة الانتظار</span>
            <span class="btn__spin" aria-hidden="true"></span>
          </button>
          <p class="fine" data-i18n-html="fine">نستخدم بياناتك فقط للتواصل معك بخصوص <span class="nw">Smart Bonus</span>.</p>
        </form>
      </div>

      <div class="done" id="wlDone" hidden>
        <div class="done__badge" aria-hidden="true">
          <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7.5 7.5L38 19"/></svg>
        </div>
        <h2 id="doneTitle"></h2>
        <p id="doneText"></p>
        <button class="btn btn--glass" data-close data-i18n="back">العودة للفيديو</button>
      </div>
    </div>
  </div>

  <script src="/js/main.js" defer></script>
</body>
</html>
